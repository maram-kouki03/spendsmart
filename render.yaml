# Render Blueprint for the SpendSmart API (Express). Render → New → Blueprint → pick this repo.
# The React app is deployed separately on Vercel (client/vercel.json); the database is Supabase.
# Variables marked `sync: false` have no value here: Render asks for them when the Blueprint is
# created (Dashboard → the service → Environment). Never commit their values.
services:
  - type: web
    name: spendsmart-api
    runtime: node
    plan: free
    region: frankfurt
    # Monorepo (npm workspaces): install from the repo root, then start the server workspace.
    buildCommand: npm install
    startCommand: npm run start -w server
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Supabase → Connect → Transaction pooler (port 6543). SSL is turned on by the server.
      - key: DATABASE_URL
        sync: false
      # Long random string that signs the session cookies.
      - key: JWT_SECRET
        sync: false
      # The Vercel URL(s) of the React app, comma-separated (e.g. https://spendsmart.vercel.app).
      - key: CLIENT_ORIGIN
        sync: false
      # The public URL of the React app, used in password-reset links (the Vercel URL).
      - key: APP_URL
        sync: false
      # Email: set BREVO_API_KEY (recommended: HTTPS API, the free plan may block SMTP ports)…
      - key: BREVO_API_KEY
        sync: false
      # …or SMTP instead (leave BREVO_API_KEY empty).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      # Sender for both transports, e.g. "SpendSmart <no-reply@yourdomain.com>" (verified in Brevo).
      - key: SMTP_FROM
        sync: false
      # Optional: Google sign-in. Leave empty to hide the Google button.
      - key: GOOGLE_CLIENT_ID
        sync: false
